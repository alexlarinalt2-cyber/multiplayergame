<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PolyRacer — Time Trial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #87c5eb; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    canvas { display: block; }

    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 8;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
      opacity: 0.2; transition: opacity 0.15s;
    }

    /* ── HUD ── */
    .hud { position: fixed; z-index: 10; color: #fff; pointer-events: none;
           text-shadow: 0 2px 8px rgba(0,0,0,0.55); }
    #hud-timer {
      top: 18px; left: 50%; transform: translateX(-50%);
      font-size: 2.6rem; font-weight: 900; letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }
    #hud-cp    { top: 78px; left: 50%; transform: translateX(-50%); font-size: 1rem; font-weight: 700; color: #cde9ff; }
    #hud-best  { top: 20px; right: 24px; font-size: 1rem; font-weight: 700; color: #ffe082; text-align: right; }
    #hud-speed { bottom: 22px; right: 28px; font-size: 2.2rem; font-weight: 900; }
    #hud-speed span { font-size: 0.95rem; font-weight: 600; color: #d6ecff; }
    #hud-hint  { bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; color: rgba(255,255,255,0.75); }
    #hud-msg {
      top: 34%; left: 50%; transform: translate(-50%, -50%);
      font-size: 4.5rem; font-weight: 900; letter-spacing: 6px;
      opacity: 0; transition: opacity 0.18s;
    }
    #hud-split {
      top: 122px; left: 50%; transform: translateX(-50%);
      font-size: 1.3rem; font-weight: 800; opacity: 0; transition: opacity 0.25s;
    }

    /* ── Overlays ── */
    .overlay {
      position: fixed; inset: 0; z-index: 100;
      display: none; align-items: center; justify-content: center;
      background: rgba(10, 18, 32, 0.82); backdrop-filter: blur(8px);
    }
    .overlay.visible { display: flex; }
    .card {
      background: rgba(12, 18, 34, 0.97);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 40px 56px;
      color: #fff; text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.9);
      max-width: 560px;
    }
    .card h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: 3px; margin-bottom: 6px; }
    .card .sub { color: #8fb8d8; font-size: 0.9rem; margin-bottom: 26px; }

    .map-btn {
      display: block; width: 100%; text-align: left;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 14px 20px; margin-bottom: 12px;
      color: #fff; cursor: pointer; font-size: 1rem;
      transition: background 0.15s, transform 0.1s;
    }
    .map-btn:hover { background: rgba(255,255,255,0.14); transform: translateX(4px); }
    .map-btn .mname { font-weight: 800; font-size: 1.15rem; letter-spacing: 1px; }
    .map-btn .mdesc { color: #9fc4e0; font-size: 0.82rem; margin-top: 2px; }
    .map-btn .mbest { float: right; color: #ffe082; font-weight: 700; font-variant-numeric: tabular-nums; }

    #fin-time  { font-size: 3rem; font-weight: 900; color: #ffe082; font-variant-numeric: tabular-nums; }
    #fin-medal { font-size: 1.6rem; font-weight: 800; margin: 8px 0 4px; }
    #fin-pb    { color: #9fc4e0; font-size: 0.95rem; margin-bottom: 26px; min-height: 1.2em; }
    .btn-row button {
      background: #2196f3; color: #fff; border: none;
      padding: 14px 36px; border-radius: 10px; margin: 0 8px;
      font-size: 1rem; font-weight: 800; letter-spacing: 2px; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-row button:hover { background: #1565c0; transform: scale(1.05); }
    .btn-row button.alt { background: rgba(255,255,255,0.12); }
    .btn-row button.alt:hover { background: rgba(255,255,255,0.22); }
  </style>
</head>
<body>

<div id="vignette"></div>

<div id="hud-timer" class="hud">0:00.00</div>
<div id="hud-cp"    class="hud"></div>
<div id="hud-split" class="hud"></div>
<div id="hud-best"  class="hud"></div>
<div id="hud-speed" class="hud">0 <span>km/h</span></div>
<div id="hud-hint"  class="hud">R — respawn &nbsp;•&nbsp; Enter — restart &nbsp;•&nbsp; Esc — maps</div>
<div id="hud-msg"   class="hud"></div>

<div id="menu" class="overlay visible">
  <div class="card">
    <h1>POLYRACER</h1>
    <div class="sub">TIME TRIAL — pick a track</div>
    <div id="map-list"></div>
  </div>
</div>

<div id="finish" class="overlay">
  <div class="card">
    <div style="font-size:3rem">&#127937;</div>
    <div id="fin-time">0:00.00</div>
    <div id="fin-medal"></div>
    <div id="fin-pb"></div>
    <div class="btn-row">
      <button id="fin-retry">RETRY</button>
      <button id="fin-menu" class="alt">TRACKS</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
<script type="module" src="polytrack-main.js"></script>
</body>
</html>
