<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Circuit Racer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    #speedometer {
      position: fixed; bottom: 28px; right: 28px; text-align: right;
    }
    #speed {
      font-size: 2.8rem; font-weight: 900; color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      letter-spacing: -1px;
    }
    #speed-label { font-size: 0.75rem; color: #aaa; letter-spacing: 2px; }

    #race-info {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 28px; align-items: center;
    }
    .info-box {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px 18px;
      text-align: center;
    }
    .info-label { font-size: 0.65rem; color: #888; letter-spacing: 2px; text-transform: uppercase; }
    .info-value { font-size: 1.4rem; font-weight: bold; color: #fff; }
    #pos-value { color: #f9c74f; }

    #timer-box { position: fixed; top: 20px; right: 28px; }
    #timer { font-size: 1.1rem; color: #ddd; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }

    #announcement {
      position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-size: 5rem; font-weight: 900; color: #fff;
      text-shadow: 0 0 60px rgba(255,120,0,0.9), 0 4px 20px rgba(0,0,0,0.8);
      display: none; pointer-events: none; letter-spacing: 4px;
      animation: pop 0.2s ease-out;
    }
    @keyframes pop { from { transform: translate(-50%,-50%) scale(1.4); } to { transform: translate(-50%,-50%) scale(1); } }

    #controls-hint {
      position: fixed; bottom: 20px; left: 20px;
      color: rgba(255,255,255,0.4); font-size: 0.75rem;
    }

    #minimap {
      position: fixed; bottom: 28px; left: 28px;
      width: 130px; height: 130px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      overflow: hidden;
    }
    #minimap canvas { width: 100%; height: 100%; }

    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 8;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.82) 100%);
      opacity: 0.28; transition: opacity 0.15s;
    }

    /* ── Nitro bar ────────────────────────────── */
    #nitro-track {
      height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px;
      overflow: hidden; margin-top: 10px;
    }
    #nitro-fill {
      height: 100%; width: 100%; background: #00e5ff; border-radius: 2px;
      transform-origin: left; transition: background 0.15s;
    }
    #nitro-label { font-size: 0.6rem; color: #888; letter-spacing: 2px; margin-top: 3px; }
    /* Nitro active — orange vignette overlay */
    #nitro-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 7;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(255,90,0,0.5) 100%);
      opacity: 0; transition: opacity 0.1s;
    }

    /* ── Traffic lights ───────────────────────── */
    #start-lights {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      z-index: 50; display: none;
    }
    .sl-housing {
      background: #111; border-radius: 14px;
      padding: 12px 18px; display: flex; gap: 12px;
      border: 3px solid #333;
      box-shadow: 0 6px 30px rgba(0,0,0,0.9);
    }
    .sl-light {
      width: 34px; height: 34px; border-radius: 50%;
      background: #2a0000; border: 2px solid #444;
      transition: background 0.08s, box-shadow 0.08s;
    }
    .sl-light.on {
      background: #ff1a00;
      box-shadow: 0 0 18px #ff1a00, 0 0 50px rgba(255,26,0,0.5);
    }

    /* ── Race results ─────────────────────────── */
    #race-results {
      position: fixed; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.78); z-index: 200;
      backdrop-filter: blur(6px);
    }
    #race-results.visible { display: flex; }
    .results-card {
      background: rgba(8,10,22,0.97);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 22px; padding: 48px 72px;
      text-align: center; color: #fff;
      box-shadow: 0 24px 80px rgba(0,0,0,0.95);
    }
    .results-flag { font-size: 4rem; margin-bottom: 10px; }
    #results-pos  { font-size: 3.2rem; font-weight: 900; color: #f9c74f; margin-bottom: 6px; letter-spacing: 2px; }
    #results-time { font-size: 1.25rem; color: #aaa; margin-bottom: 32px; }
    #results-btn  {
      background: #e63946; color: #fff; border: none;
      padding: 16px 48px; border-radius: 10px;
      font-size: 1.1rem; font-weight: 900; cursor: pointer;
      letter-spacing: 3px; transition: background 0.2s, transform 0.1s;
    }
    #results-btn:hover { background: #b71c1c; transform: scale(1.05); }
  </style>
</head>
<body>

<div id="vignette"></div>
<div id="nitro-glow"></div>
<div id="hud">
  <div id="race-info">
    <div class="info-box"><div class="info-label">Lap</div><div class="info-value" id="lap">1 / 3</div></div>
    <div class="info-box"><div class="info-label">Position</div><div class="info-value" id="pos-value">P1</div></div>
    <div class="info-box" id="last-lap-box" style="display:none"><div class="info-label">Last Lap</div><div class="info-value" id="last-lap">—</div></div>
    <div class="info-box" id="best-lap-box" style="display:none"><div class="info-label">Best Lap</div><div class="info-value" id="best-lap" style="color:#00e5ff">—</div></div>
  </div>
  <div id="timer-box"><div class="info-label">TIME</div><div id="timer">0:00.00</div></div>
  <div id="speedometer">
    <div id="speed">0</div>
    <div id="speed-label">KM/H</div>
    <div id="nitro-track"><div id="nitro-fill"></div></div>
    <div id="nitro-label">NITRO</div>
  </div>
  <div id="announcement"></div>
  <div id="controls-hint">W/↑ Throttle &nbsp; S/↓ Brake &nbsp; A/← D/→ Steer &nbsp; Space Handbrake &nbsp; Shift Nitro</div>
  <div id="minimap"><canvas id="mapCanvas" width="130" height="130"></canvas></div>
</div>

<div id="start-lights">
  <div class="sl-housing">
    <div class="sl-light" id="sl-1"></div>
    <div class="sl-light" id="sl-2"></div>
    <div class="sl-light" id="sl-3"></div>
    <div class="sl-light" id="sl-4"></div>
    <div class="sl-light" id="sl-5"></div>
  </div>
</div>
<div id="race-results">
  <div class="results-card">
    <div class="results-flag">&#127937;</div>
    <div id="results-pos">P1</div>
    <div id="results-time">0:00.00</div>
    <button id="results-btn" onclick="location.reload()">RACE AGAIN</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
    "three/examples/jsm/environments/RoomEnvironment.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js",
    "three/examples/jsm/objects/Sky.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/objects/Sky.js",
    "three/examples/jsm/postprocessing/EffectComposer.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js",
    "three/examples/jsm/postprocessing/RenderPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js",
    "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js"
  }
}
</script>
<script type="module" src="racing-main.js"></script>
</body>
</html>
