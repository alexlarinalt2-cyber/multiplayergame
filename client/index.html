<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floor is Lava</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #ui {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #lobby {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 20;
      gap: 16px;
    }
    #lobby h1 {
      font-size: 3rem;
      color: #ff6a00;
      text-shadow: 0 0 30px #ff4400;
      letter-spacing: 4px;
    }
    #lobby p { color: #aaa; font-size: 1rem; }
    #lobby input {
      padding: 12px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 2px solid #ff6a00;
      background: #1a0000;
      color: #fff;
      outline: none;
      text-align: center;
      pointer-events: all;
    }
    #lobby button {
      padding: 12px 36px;
      font-size: 1.1rem;
      background: #ff4400;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      pointer-events: all;
      transition: background 0.2s;
    }
    #lobby button:hover { background: #ff6a00; }

    #scoreboard {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #ff4400;
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.85rem;
      min-width: 140px;
      display: none;
    }
    #scoreboard h3 { color: #ff6a00; margin-bottom: 8px; font-size: 0.9rem; }
    #scoreboard .entry { display: flex; justify-content: space-between; gap: 20px; padding: 2px 0; }

    #announcement {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 40px #ff4400;
      text-align: center;
      display: none;
      pointer-events: none;
      z-index: 30;
    }

    #playercount {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #ff8844;
      font-size: 0.9rem;
      display: none;
    }

    #controls {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #555;
      font-size: 0.8rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

<div id="lobby">
  <h1>FLOOR IS LAVA</h1>
  <p>Last one standing wins</p>
  <input id="nameInput" type="text" placeholder="Enter your name" maxlength="16" />
  <button id="joinBtn">JOIN GAME</button>
</div>

<div id="ui">
  <div id="scoreboard"><h3>SCORES</h3><div id="scoreList"></div></div>
  <div id="announcement"></div>
  <div id="playercount"></div>
  <div id="controls">WASD / Arrow Keys to move &nbsp;|&nbsp; SPACE to jump</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js",
    "socket.io-client": "https://cdn.socket.io/4.7.2/socket.io.esm.min.js"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
